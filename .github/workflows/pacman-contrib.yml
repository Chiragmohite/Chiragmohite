name: Pac-Man Contribution Graph

on:

  schedule:

    # Runs once a day at 00:00 UTC

    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:

      contents: write

    steps:

      - name: Generate Pac-Man contribution graph

        uses: Platane/snk@v3

        with:

          github_user_name: Chiragmohite

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push output to output-pacman branch

        uses: crazy-max/ghaction-github-pages@v4

        with:

          target_branch: output-pacman

          build_dir: dist

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

